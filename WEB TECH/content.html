<!DOCTYPE html>
<html>
<head>
    <style>
         /* --- SHARED HIGH-END ANIMATION CSS START (Identical to Login) --- */
         :root {
            --primary-color: #4facfe;
            --secondary-color: #00f2fe;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            perspective: 1000px;
            padding: 30px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .background-shapes {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            transform-style: preserve-3d;
            animation: revolve 20s infinite linear;
        }
        .shape {
            position: absolute;
            width: 150px; height: 200px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            opacity: 0.3;
            border-radius: 10px;
            box-shadow: 0 0 20px var(--primary-color);
        }
        .s1 { top: 20%; left: 20%; transform: translateZ(-200px) rotateY(45deg); }
        .s2 { bottom: 30%; right: 25%; transform: translateZ(-100px) rotateX(30deg); animation-delay: -5s;}
        .s3 { top: 60%; left: 50%; transform: translateZ(-300px) rotateZ(-45deg); animation-delay: -10s;}
        @keyframes revolve {
            0% { transform: rotateY(0deg) rotateX(0deg); }
            100% { transform: rotateY(360deg) rotateX(360deg); }
        }
        /* --- SHARED CSS END --- */

        /* Glassmorphism Content Card */
        .content-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            max-width: 800px;
            text-align: center;
        }

        h2 {
            font-size: 3em;
            margin-bottom: 20px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p { font-size: 1.2em; line-height: 1.6; margin-bottom: 40px; color: #e0e0e0;}
        
        .cta-button {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
            transition: transform 0.2s;
        }
        .cta-button:hover { transform: scale(1.05) translateY(-3px); }
    </style>
</head>
<body>
     <div class="background-shapes">
        <div class="shape s1"></div>
        <div class="shape s2"></div>
        <div class="shape s3"></div>
    </div>

    <div class="content-card">
        <h2>Welcome to the Future of Reading</h2>
        <p>Experience our curated collection in a immersive environment. Log in to access exclusive content or browse our public catalogue below.</p>
        <a href="catalogue.html" class="cta-button">Enter Catalogue</a>
    </div>
</body>
</html>
