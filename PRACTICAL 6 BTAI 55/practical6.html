<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number to Words Converter (0-999)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 25px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            min-height: 1.2em; /* Reserves space for the result */
        }
        .error {
            color: #dc3545;
            font-size: 14px;
            font-weight: normal;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Number to Words</h2>
    <p style="color: #666; font-size: 14px;">Enter a number between 0 and 999</p>
    <input type="text" id="numberInput" placeholder="e.g., 123">
    <button onclick="convert()">Convert to Words</button>
    <div id="result"></div>
</div>

<script>
    // Main function called when the button is clicked
    function convert() {
        const inputElement = document.getElementById('numberInput');
        const resultElement = document.getElementById('result');
        const inputValue = inputElement.value.trim();

        // --- VALIDATION ---

        // 1. Check for empty input
        if (inputValue === "") {
            resultElement.innerHTML = '<span class="error">Please enter a number.</span>';
            return;
        }

        // 2. Check if the input contains only digits using a Regular Expression.
        // This rejects alphabets, special characters, and even negative signs.
        if (!/^\d+$/.test(inputValue)) {
            resultElement.innerHTML = '<span class="error">Invalid input. Please enter only digits.</span>';
            return;
        }

        // Convert the string to an integer for further checking
        const num = parseInt(inputValue, 10);

        // 3. Check for the valid range (0 to 999).
        // This automatically handles the "four and above digits" requirement.
        if (num < 0 || num > 999) {
            resultElement.innerHTML = '<span class="error">Number must be between 0 and 999.</span>';
            return;
        }

        // --- CONVERSION ---
        
        // If all validations pass, convert the number and display the result.
        const words = numberToWords(num);
        resultElement.textContent = words;
    }

    // Helper function to perform the core number-to-words logic
    function numberToWords(num) {
        // Handle the special case for 0
        if (num === 0) return "Zero";

        // Arrays to hold word representations of numbers
        const units = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'];
        const teens = ['Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
        const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

        let words = '';

        // Calculate the digits for hundreds, tens, and units places
        const hundreds = Math.floor(num / 100);
        const remainder = num % 100; // The last two digits
        const ten = Math.floor(remainder / 10);
        const unit = remainder % 10;

        // Construct the "Hundreds" part
        if (hundreds > 0) {
            words += units[hundreds] + ' Hundred';
            // Add " and " if there are more numbers to follow
            if (remainder > 0) {
                words += ' and ';
            }
        }

        // Construct the remaining part (0-99)
        if (remainder > 0) {
            if (remainder < 10) {
                // Single digit (1-9)
                words += units[remainder];
            } else if (remainder < 20) {
                // Teens (10-19)
                words += teens[remainder - 10];
            } else {
                // Numbers 20-99
                words += tens[ten];
                if (unit > 0) {
                    words += ' ' + units[unit];
                }
            }
        }

        return words;
    }
</script>

</body>
</html>
